[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awrouter"
version = "0.1.0"
description = "Aither World Router — the stateless LLM routing plane: model resolution, backend discovery + failover, tier maps, context-window fitting, SSE streaming. OpenAI-compatible, standalone, no fleet dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# The core (registry/resolver/wire) is stdlib-only. FastAPI/uvicorn are needed
# only for the `serve` subcommand; the package imports them lazily and fails
# with a clear message when absent (the awrtifact spec-extra idiom — the same
# split, on purpose).
[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://github.com/Aitherium/awrouter"
Documentation = "https://github.com/Aitherium/awrouter#readme"
Repository = "https://github.com/Aitherium/awrouter.git"
Issues = "https://github.com/Aitherium/awrouter/issues"

[project.scripts]
awrouter = "awrouter.cli:main"

[tool.setuptools]
packages = ["awrouter"]
